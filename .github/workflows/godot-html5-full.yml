name: Build Godot HTML5 (3.x and 4.x)

on:
  push:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/**'
      - '**/*.godot'
  workflow_dispatch:

jobs:
  build-html5:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot_version: ['4.2.4', '3.5.2']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Godot project and export presets
        id: check
        run: |
          missing=0
          if [ ! -f "project.godot" ]; then
            echo "project_missing=true" >> "$GITHUB_OUTPUT"
            missing=1
          else
            echo "project_missing=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -f "export_presets.cfg" ]; then
            echo "export_missing=true" >> "$GITHUB_OUTPUT"
            missing=1
          else
            echo "export_missing=false" >> "$GITHUB_OUTPUT"
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Skip build if files missing
        if: steps.check.outputs.missing == '1'
        run: |
          echo "Skipping HTML5 build because required files are missing." > build_status.txt
          echo "project_missing=${{ steps.check.outputs.project_missing }}" >> build_status.txt
          echo "export_missing=${{ steps.check.outputs.export_missing }}" >> build_status.txt

      - name: Setup Godot (download engine + export templates)
        if: steps.check.outputs.missing == '0'
        uses: game-ci/godot-setup@v2
        with:
          godot-version: ${{ matrix.godot_version }}
          export-templates: true

      - name: Export HTML5
        if: steps.check.outputs.missing == '0'
        run: |
          set -e
          echo "Using Godot version: ${{ matrix.godot_version }}"
          # godot CLI provided by game-ci/godot-setup should be on PATH as 'godot'
          mkdir -p build/html5/${{ matrix.godot_version }}
          godot --version || true
          godot --no-window --export "HTML5" "build/html5/${{ matrix.godot_version }}/index.html"

      - name: Upload build artifact
        if: steps.check.outputs.missing == '0'
        uses: actions/upload-artifact@v4
        with:
          name: html5-build-${{ matrix.godot_version }}
          path: build/html5/${{ matrix.godot_version }}

      - name: Upload build status artifact
        if: steps.check.outputs.missing == '1'
        uses: actions/upload-artifact@v4
        with:
          name: html5-build-status
          path: build_status.txt
